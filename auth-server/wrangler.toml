name = "auth-server"
main = "build/index.js"
compatibility_date = "2026-04-24"

[observability]
enabled = true
head_sampling_rate = 1

[placement]
mode = "smart"

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release --panic-unwind"

# Local dev (wrangler dev)
[[d1_databases]]
binding = "DB"
database_name = "auth-db-local"
database_id = "local"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "ef84976498e54d42b6f30c95676d3e90"
preview_id = "80d4152954e340299efa3ee978e3953a"

[durable_objects]
bindings = [
  { name = "AUTH_DO", class_name = "AuthDurableObject" },
  { name = "OAUTH_STATE_DO", class_name = "OAuthStateDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["OAuthStateDurableObject"]

[[queues.producers]]
binding = "QUEUE"
queue = "auth-queue-local"

[[queues.producers]]
binding = "AUTH_DLQ"
queue = "auth-queue-local-dlq"

[[queues.consumers]]
queue             = "auth-queue-local"
max_batch_size    = 10
max_batch_timeout = 30
max_retries       = 5
dead_letter_queue = "auth-queue-local-dlq"

# staging

[env.staging]

[env.staging.vars]
OAUTH_REDIRECT_URI="https://auth-server-staging.cook-note.workers.dev/auth/google/callback"
JWT_ISSUER="https://auth-server-staging.cook-note.workers.dev"
JWT_DEFAULT_AUDIENCE="app-api"
ALLOWED_AUDIENCES="app-api,cook-note"
APP_CLIENTS='[{"client_id":"cook-note-web","token_audience":"cook-note","redirect_uri":"https://cook-note.example.com/auth/callback"}]'
REFRESH_TOKEN_TTL_SECS="2592000"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "auth-db-staging"
database_id = "3a552034-f594-489b-8529-3a6c847e269a"
migrations_dir = "db/migrations"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "ef84976498e54d42b6f30c95676d3e90"
preview_id = "80d4152954e340299efa3ee978e3953a"

[env.staging.durable_objects]
bindings = [
  { name = "AUTH_DO", class_name = "AuthDurableObject" },
  { name = "OAUTH_STATE_DO", class_name = "OAuthStateDurableObject" }
]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["AuthDurableObject"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["OAuthStateDurableObject"]

[[env.staging.queues.producers]]
binding = "QUEUE"
queue = "auth-queue-staging"

[[env.staging.queues.producers]]
binding = "AUTH_DLQ"
queue = "auth-queue-staging-dlq"

[[env.staging.queues.consumers]]
queue             = "auth-queue-staging"
max_batch_size    = 10
max_batch_timeout = 30
max_retries       = 5
dead_letter_queue = "auth-queue-staging-dlq"

