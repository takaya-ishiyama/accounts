[package]
name = "auth-server"
version = "0.1.0"
edition = "2021"
authors = ["takaya-ishiyama <takaya.ishiyama00810@gmail.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["http", "axum", "d1", "queue"] }
worker-macros = { version = "0.8", features = ["http"] }
axum = { version = "0.8", default-features = false, features = ["query"] }
tower-service = "0.3.3"
uuid = { version = "1.23", features = ["v7", "serde", "js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"
num-bigint = "0.4"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
