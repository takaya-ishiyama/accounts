[settings]
env = ["local"]

[tasks.dev]
run="npx wrangler dev"

[tasks.migrate-local]
dir = "db"
run="atlas schema apply --env local"

[tasks.migrate-diff]
dir = "db"
run="atlas migrate diff --env local"

[tasks.migrate-staging]
dir = "db"
run="wrangler d1 migrations apply auth-db-staging --remote --env staging"

[tasks.migrate-production]
dir = "db"
run="wrangler d1 migrations apply auth-db-production --remote --env production"
